{id:'psi',L:'G',n:'Psiquiatria',ic:'💭',p:'Psiquiatra',c:'Consulta com psiquiatra (laudo no modelo do Anexo IV)',req:'Consulta com médico especialista em Psiquiatria e laudo médico descritivo e conclusivo, obrigatoriamente elaborado conforme o modelo do Anexo IV do edital.',ex:[],

{id:'neu',L:'I',n:'Neurologia',ic:'🧠',p:'Neurologista',c:'Consulta com neurologista',req:'Avaliação clínica neurológica com anamnese detalhada e exame físico completo, realizada por médico especialista em Neurologia.',ex:[['Eletroencefalograma (EEG)',180,CL]]},
{id:'oft',L:'J',n:'Oftalmologia',ic:'👁️',p:'Oftalmologista',c:'Consulta com oftalmologista',req:'Avaliação clínica oftalmológica realizada por médico especialista em Oftalmologia.',

const ITEMS=[],ID={};
G.forEach(g=>{if(g.c)ITEMS.push({id:g.id+'_c',g:g.id,k:'c',nome:g.c,v:0});g.ex.forEach((e,i)=>ITEMS.push({id:g.id+'_'+i,g:g.id,k:'e',nome:e[0],v:e[1],nota:e[2],sub:e[3]}))});
ITEMS.forEach(x=>ID[x.id]=x);const GI={};G.forEach(g=>GI[g.id]=g);

const HDR='Estou realizando a avaliação de saúde do concurso de Soldado Bombeiro Militar do Maranhão 2026 (Edital nº 1 – CBM/MA).';
const exL=(a)=>a.map(e=>'- '+e[0]+(e[2]?' — '+e[2]:'')).join('\n');
const detL=g=>(g.det||[]).map(d=>d[0]+':\n'+d[1].map(l=>'- '+l).join('\n')).join('\n\n');
const labEx=G[0].ex.filter(e=>e[3]!==SB.tx),txEx=G[0].ex.filter(e=>e[3]===SB.tx);
const TX=[['Texto geral — para todos os laboratórios',`Estou realizando os exames para a avaliação de saúde do concurso de Soldado Bombeiro Militar do Maranhão 2026. Preciso que todos os exames sejam emitidos com:\n\n1. Meu nome completo.\n2. Número do RG e/ou CPF.\n3. Órgão emissor do documento de identidade.\n4. Assinatura do profissional responsável.\n5. Especialidade do profissional responsável.\n6. Registro no conselho de classe específico.\n7. Laudo conclusivo para cada exame.\n\nCaso seja um exame de imagem ou radiológico, preciso também receber as imagens em alta resolução, além do laudo médico descritivo.\n\nOs exames precisam estar dentro dos prazos de validade estabelecidos no edital.`],
['Texto geral — para médicos especialistas',`Estou realizando a avaliação de saúde do concurso de Soldado Bombeiro Militar do Maranhão 2026. Preciso que a avaliação e o laudo sigam as exigências do item 9.6 do edital, contendo anamnese, exame físico e todos os elementos específicos exigidos para sua especialidade.\n\nÉ importante que o laudo seja descritivo e conclusivo e que faça referência aos exames complementares, mencionando os respectivos resultados e laudos.`],
...G.filter(g=>g.c).map(g=>[g.p,[HDR,g.req,g.ex.length?'Exames complementares exigidos:\n'+exL(g.ex):'',detL(g),(g.al||[]).join('\n'),g.ex.length?'O laudo deve ser descritivo e conclusivo e mencionar os resultados e laudos dos exames complementares.':'O laudo deve ser descritivo e conclusivo.'].filter(Boolean).join('\n\n')]),

function stats(){const A=act(),ex=A.filter(x=>x.k==='e'),co=A.filter(x=>x.k==='c'),d=x=>get(x.id).d,l=x=>get(x.id).laudo|0;const sp=G.filter(g=>g.c);
 const done=A.filter(d).length;return{tot:A.length,done,pct:A.length?Math.round(done/A.length*100):0,prof:co.filter(d).length,profT:co.length,exD:ex.filter(d).length,exT:ex.length,rec:A.filter(x=>l(x)>0).length,conf:A.filter(x=>l(x)===2).length,chk:A.filter(x=>l(x)===1).length,esp:sp.filter(g=>of(g).every(d)).length,espT:sp.length}}
function upd(){document.querySelectorAll('[data-v]').forEach(e=>e.innerHTML=vchip(ID[e.dataset.v]));const s=stats();$('#tp').style.width=s.pct+'%';$('#tpt').textContent=s.pct+'% concluído'}
/* ========== COMPONENTES ========== */
const inp=(id,f,cap,type='text')=>`<label class="lb"><span>${cap}</span><input type="${type}" data-id="${id}" data-f="${f}" value="${esc(get(id)[f])}"></label>`;
const lsel=id=>`<label class="lb"><span>Status do laudo</span><select data-id="${id}" data-f="laudo">${['Não recebido','Recebido','Conferido'].map((t,i)=>`<option value="${i}"${(get(id).laudo|0)===i?' selected':''}>${t}</option>`).join('')}</select></label>`;
const obs=id=>`<textarea rows="2" data-id="${id}" data-f="obs" placeholder="Observações" aria-label="Observações">${esc(get(id).obs)}</textarea>`;
const bar=p=>`<div class="pb"><i style="width:${p}%"></i></div>`;
/* ========== VIEWS ========== */
function vGeral(){const s=stats(),A=act();
 const pend=A.filter(x=>!get(x.id).d).sort((a,b)=>{const p=get(a.id).dt||'9999',q=get(b.id).dt||'9999';return p<q?-1:p>q?1:0}).slice(0,8);
 const st=(l,v,sub)=>`<div class="card st"><span>${l}</span><b>${v}</b><small>${sub}</small></div>`;
 return `<h2>Visão Geral</h2>
<div class="alert"><b>Regras de validade do edital</b><ul><li>Exames laboratoriais e complementares: realizados em até <b>180 dias</b> antes da entrega.</li><li>Beta-HCG: validade máxima de <b>30 dias</b>.</li><li>Toxicológico: realizado em até <b>60 dias</b> antes da entrega, com janela de detecção mínima de <b>90 dias</b>.</li><li>Radiografia panorâmica odontológica: validade máxima de <b>seis meses</b>.</li></ul></div>
<div class="card"><h3>Progresso geral</h3><div class="big">${s.pct}%</div>${bar(s.pct)}<small>${s.done} de ${s.tot} itens concluídos (consultas + exames) · ${s.esp} de ${s.espT} especialidades concluídas · ${s.exT-s.exD} exames pendentes · ${s.chk} documentos aguardando conferência</small></div>
<div class="grid g5" style="margin-bottom:14px">${st('Profissionais visitados',s.prof+'/'+s.profT,'consultas realizadas')}${st('Exames realizados',s.exD+'/'+s.exT,'marcados como concluídos')}${st('Laudos recebidos',s.rec,'recebidos ou conferidos')}${st('Exames pendentes',s.exT-s.exD,'ainda a realizar')}${st('Documentos conferidos',s.conf,s.chk+' a conferir')}</div>
<div class="card"><h3>Configurações</h3><div class="fl">${`<label class="lb"><span>Data de entrega da documentação (definida no edital de convocação)</span><input type="date" data-f="entrega" value="${esc(S.entrega)}"></label>`}<label class="chk" style="align-self:end"><input type="checkbox" data-f="fem"${S.fem?' checked':''}> Candidata do sexo feminino (exige Beta-HCG)</label></div><small>Os prazos de validade são contados a partir da data de entrega informada, não da data de hoje.</small></div>
<div class="card"><h3>Próximas tarefas</h3>${pend.length?pend.map(x=>`<div class="tl"><span>${GI[x.g].ic} <b>${esc(GI[x.g].n)}</b> — ${esc(x.nome)} ${get(x.id).dt?chip('yellow','Data: '+fd(get(x.id).dt)):''}</span><button class="btn s" data-act="goto" data-v="4">Abrir</button></div>`).join(''):'<p>🎉 Nenhuma tarefa pendente.</p>'}</div>
<div class="card"><h3>Dados e backup</h3><small>Os dados ficam salvos no navegador (LocalStorage). Gere um backup JSON, copie ou baixe, e cole aqui para importar.</small>
<textarea class="bk" id="bk" placeholder="O backup JSON aparece aqui; cole um backup para importar."></textarea><div class="acts"><button class="btn" data-act="exp">Exportar JSON</button><button class="btn s" data-act="dl">Baixar arquivo</button><button class="btn s" data-act="imp">Importar do texto</button><label class="btn s">Importar arquivo<input type="file" id="fi" accept=".json,application/json" hidden></label><button class="btn d" data-act="clr">Limpar todos os dados</button></div><small id="bkm"></small></div>`}
function pcard(g){const c=ID[g.id+'_c'],A=of(g),ex=A.filter(x=>x.k==='e');
 if(!c)return `<article class="card"><h3>${g.ic} ${g.n}</h3><p class="mut">Categoria separada: não é uma especialidade médica.</p><ul class="ul">${ex.map(x=>`<li${get(x.id).d?' class="dn"':''}>${esc(x.nome)}</li>`).join('')}</ul><small>${ex.filter(x=>get(x.id).d).length}/${ex.length} concluídos</small><div class="acts"><button class="btn s" data-act="goto" data-v="4">Abrir no checklist</button></div></article>`;
 const s=get(c.id);return `<article class="card"><div class="sh"><h3>${g.ic} ${g.n}</h3><span data-v="${c.id}">${vchip(c)}</span></div><ul class="ul">${ex.map(x=>`<li${get(x.id).d?' class="dn"':''}>${esc(x.nome)}</li>`).join('')||'<li>Laudo descritivo e conclusivo (modelo do Anexo IV)</li>'}</ul>
<button class="btn${s.d?' on':''}" data-act="visit" data-id="${c.id}">${s.d?'✔ Profissional visitado (desmarcar)':'Marcar profissional como visitado'}</button>
<div class="fl">${inp(c.id,'prof','Nome do profissional')}${inp(c.id,'who','Clínica ou hospital')}${inp(c.id,'dt','Data da consulta','date')}</div>${obs(c.id)}</article>`}
const vProf=()=>`<h2>Profissionais de Saúde</h2><div class="grid">${G.filter(g=>g.id!=='abd').map(pcard).join('')}</div><p class="mut">A consulta não substitui os exames complementares: cada exame é marcado separadamente na aba “Meus Exames”.</p>`;
function ecard(g){let last,h='';ITEMS.filter(x=>x.g===g.id&&x.k==='e').forEach(x=>{
 if(x.sub&&x.sub!==last){if(last)h+='</ul>';h+=`<div class="sub">${x.sub}</div><ul class="ul">`;last=x.sub}else if(!x.sub&&last===undefined){h+='<ul class="ul">';last=''}
 const d=get(x.id).d;h+=`<li${d?' class="dn"':''}>${d?'✔ ':''}${esc(x.nome)}${x.nota?` <small>— ${esc(x.nota)}</small>`:''} ${x.v?chip('gr',VT[x.v]):''}</li>`});
 if(last!==undefined)h+='</ul>';
 return `<article class="card"><h3>${g.L} · ${g.ic} ${g.n}</h3><p>${esc(g.req)}</p>${g.c?'<span class="chip gr">Avaliação clínica ≠ exames complementares</span>':''}${h}${(g.det||[]).map(d=>`<div class="det"><b>${d[0]}</b><ul>${d[1].map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`).join('')}${(g.al||[]).map(a=>`<div class="alert">⚠ ${esc(a)}</div>`).join('')}</article>`}
const vEx=()=>`<h2>Exames por Especialidade</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">${G.map(ecard).join('')}</div>`;
const vOri=()=>`<h2>O que preciso informar aos médicos e laboratórios?</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">${TX.map((t,i)=>`<article class="card"><h3>${esc(t[0])}</h3><pre>${esc(t[1])}</pre><button class="btn" data-act="copy" data-i="${i}">Copiar</button></article>`).join('')}</div>`;
function row(x){const s=get(x.id),c=x.k==='c';return `<div class="row${s.d?' ok':''}"><div class="sh"><label class="chk"><input type="checkbox" data-f="d" data-id="${x.id}"${s.d?' checked':''}><b>${esc(x.nome)}</b></label><span data-v="${x.id}">${vchip(x)}</span></div>${x.nota?`<small>${esc(x.nota)}</small>`:''}<div class="fl">${c?inp(x.id,'prof','Profissional'):''}${inp(x.id,'who',c?'Clínica ou hospital':'Clínica ou profissional')}${inp(x.id,'dt',c?'Data da consulta':'Data de realização','date')}${lsel(x.id)}</div>${obs(x.id)}</div>`}
function vChk(){const s=stats();return `<h2>Meus Exames / Checklist</h2><div class="acts"><button class="btn${F?' s':''}" data-act="filt" data-v="0">Todos (${s.tot})</button><button class="btn${F?'':' s'}" data-act="filt" data-v="1">Pendentes (${s.tot-s.done})</button></div>`+
 G.map(g=>{let A=of(g);const d=A.filter(x=>get(x.id).d).length;if(F)A=A.filter(x=>!get(x.id).d);return `<div class="hd"><h3>${g.ic} ${g.n}</h3><span class="chip ${d===of(g).length?'green':'gr'}">${d}/${of(g).length} concluídos</span></div>${A.map(row).join('')||'<p class="mut">✔ Nada pendente.</p>'}`}).join('')}
function vFinal(){const A=act(),n=FIN.filter((_,i)=>S.final[i]).length,p=Math.round(n/FIN.length*100),rd=x=>validity(x)?.c;
 const li=[['Itens ainda não concluídos',A.filter(x=>!get(x.id).d).length],['Laudos ainda não conferidos',A.filter(x=>(get(x.id).laudo|0)<2).length],['Exames fora do prazo',A.filter(x=>rd(x)==='red').length],['Exames próximos do vencimento',A.filter(x=>rd(x)==='yellow').length],['Exames concluídos sem data registrada',A.filter(x=>x.v&&get(x.id).d&&!get(x.id).dt).length]];
 return `<h2>Conferência Final</h2><div class="alert red"><b>Atenção:</b> esta ferramenta serve apenas para organização e conferência documental. Concluir os checklists não significa que você está apto na avaliação médica.</div>
<div class="card"><h3>Prontidão documental</h3><div class="big">${p}%</div>${bar(p)}<small>${n} de ${FIN.length} itens de conferência marcados</small><div style="margin-top:10px">${li.map(l=>`<div class="tl"><span>${l[0]}</span>${chip(l[1]?'yellow':'green',l[1])}</div>`).join('')}</div></div>
<div class="card"><h3>Itens de conferência</h3>${FIN.map((t,i)=>`<div class="tl"><label class="chk"><input type="checkbox" data-f="fin" data-k="${i}"${S.final[i]?' checked':''}> ${t}</label></div>`).join('')}</div>`}
const VIEWS=[vGeral,vProf,vEx,vOri,vChk,vFinal],TABS=['Visão Geral','Profissionais de Saúde','Exames por Especialidade','Orientações para Consultas e Laboratórios','Meus Exames / Checklist','Conferência Final'];
function render(){$('#nav').innerHTML=TABS.map((t,i)=>`<button class="${i===T?'on':''}" data-act="tab" data-v="${i}">${t}</button>`).join('');$('#main').innerHTML=VIEWS[T]();upd()}
/* ========== EVENTOS ========== */
const commit=r=>{Store.save();r?render():upd()};
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f||t.type==='checkbox'||t.tagName==='SELECT')return;
 if(t.dataset.id)it(t.dataset.id)[f]=t.value;else S[f]=t.value;commit(false)});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset.f;
 if(t.id==='fi'&&t.files[0]){const r=new FileReader();r.onload=()=>{$('#bk').value=r.result;doImport()};r.readAsText(t.files[0]);return}
 if(!f||!(t.type==='checkbox'||t.tagName==='SELECT'))return;const v=t.type==='checkbox'?t.checked:+t.value;
 if(f==='fin')S.final[t.dataset.k]=v;else if(t.dataset.id)it(t.dataset.id)[f]=v;else S[f]=v;commit(true)});
async function copy(txt,b){try{await navigator.clipboard.writeText(txt)}catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
 const o=b.textContent;b.textContent='Copiado ✓';setTimeout(()=>b.textContent=o,1600)}
const msg=t=>{const m=$('#bkm');if(m)m.textContent=t};
function json(){return JSON.stringify({app:'cbmma-saude-checklist',versao:1,data:S},null,2)}
function doImport(){try{const o=JSON.parse($('#bk').value),d=o.data||o;if(!d||typeof d!=='object'||!d.items)throw 0;S=Object.assign({},DEF,d);S.final=S.final||{};Store.save();render();msg('Backup importado com sucesso.')}catch(e){msg('JSON inválido: nada foi alterado.')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='tab'){T=+b.dataset.v;render();scrollTo(0,0)}
 else if(a==='goto'){T=+b.dataset.v;render();scrollTo(0,0)}
 else if(a==='visit'){const s=it(b.dataset.id);s.d=!s.d;commit(true)}
 else if(a==='filt'){F=+b.dataset.v;render()}
 else if(a==='copy')copy(TX[+b.dataset.i][1],b)
 else if(a==='exp'){$('#bk').value=json();$('#bk').select();copy(json(),b);msg('Backup gerado (copiado para a área de transferência). Guarde este texto em um arquivo seguro.')}
 else if(a==='dl'){try{const u=URL.createObjectURL(new Blob([json()],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='cbmma-saude-backup.json';l.click();$('#bk').value=json();msg('Se o download não iniciar neste ambiente, copie o texto acima e salve em um arquivo .json.')}catch(_){$('#bk').value=json();msg('Copie o texto acima e salve em um arquivo .json.')}}
 else if(a==='imp')doImport()
 else if(a==='clr'){if(!clr){clr=1;b.textContent='Clique de novo para confirmar a exclusão';setTimeout(()=>{clr=0;b.textContent='Limpar todos os dados'},5000)}else{clr=0;S=JSON.parse(JSON.stringify(DEF));try{localStorage.removeItem(KEY)}catch(_){}render()}}});
render();
</script></body></html>
